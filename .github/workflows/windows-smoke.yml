name: Windows release smoke
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Release state and installer path to check
        type: choice
        required: true
        default: draft
        options:
          - draft
          - live
      tag:
        description: Release tag, for example v0.1.0
        required: true
        type: string
      setup_sha256:
        description: Independently recorded setup SHA-256 in hex
        required: true
        type: string
      exe_sha256:
        description: Independently recorded installed executable SHA-256 in hex
        required: true
        type: string
      package_sha512:
        description: Draft package SHA-512 in hex, required when package assets exist
        required: false
        type: string
permissions:
  contents: read
env:
  RELEASE_MODE: ${{ inputs.mode }}
  RELEASE_TAG: ${{ inputs.tag }}
  SETUP_SHA256: ${{ inputs.setup_sha256 }}
  EXE_SHA256: ${{ inputs.exe_sha256 }}
  PACKAGE_SHA512: ${{ inputs.package_sha512 }}
jobs:
  draft:
    if: inputs.mode == 'draft'
    permissions:
      contents: write
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install release and check the app
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/smoke.ps1
  live:
    if: inputs.mode == 'live'
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install release and check the app
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/smoke.ps1
