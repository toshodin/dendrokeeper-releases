name: Windows release smoke
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Draft release tag, for example v0.1.0
        required: true
        type: string
      setup_sha256:
        description: Independently recorded setup SHA-256 in hex
        required: true
        type: string
      exe_sha256:
        description: Independently recorded installed executable SHA-256 in hex
        required: true
        type: string
      package_sha512:
        description: Assembled package SHA-512 in hex, required when parts exist
        required: false
        type: string
permissions:
  contents: read
jobs:
  smoke:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install draft assets and check the app
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          SETUP_SHA256: ${{ inputs.setup_sha256 }}
          EXE_SHA256: ${{ inputs.exe_sha256 }}
          PACKAGE_SHA512: ${{ inputs.package_sha512 }}
        run: ./scripts/smoke.ps1
